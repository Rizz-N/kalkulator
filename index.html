<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Kalkulator</title>
  </head>
  <body class="h-screen flex items-center justify-center">
    <div class="bg-blue-300 w-3/10 absolute p-4 rounded-lg shadow-md/90">
      <div class="bg-white m-2 text-end p-2 ring-2 rounded-lg shadow-md/40">
        <span class="calc-screen">0</span>
      </div>
      <div class="grid grid-cols-4 uppercase">
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4 col-span-2"
        >
          c
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          &larr;
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          &divide;
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          7
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          8
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          9
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          &times;
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          4
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          5
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          6
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          &minus;
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          1
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          2
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          3
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          &plus;
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4 col-span-3"
        >
          0
        </button>
        <button
          class="font-medium hover:text-white calc-button bg-white hover:bg-linear-65 hover:from-blue-500 hover:to-indigo-500 hover:shadow-md/40 transition-all duration-300 rounded-lg shadow-md/90 m-2 py-4"
        >
          &equals;
        </button>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
